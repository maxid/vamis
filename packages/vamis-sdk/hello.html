<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vamis JS SDK</title>
    <link rel="stylesheet" href="./sdk.css" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--background, #f4f6f8);
      }
      #root {
        max-width: 960px;
        margin: 24px auto;
        padding: 0 16px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./sdk.js"></script>
    <script>
      vamis.embed('#root', {
        type: 'page',
        title: '表单页面',
        body: {
          type: 'form',
          mode: 'horizontal',
          body: [
            { type: 'input-text', name: 'name', label: 'Name', value: 'Vamis' },
          ],
        },
      })
    </script>
  </body>
</html>
