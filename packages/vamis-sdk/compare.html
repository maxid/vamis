<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amis / Vamis SDK 对照</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #0f172a;
      }
      body {
        margin: 0;
        background: #f8fafc;
      }
      header {
        padding: 16px 20px 8px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 6px;
      }
      p,
      label {
        font-size: 13px;
        color: #475569;
      }
      select {
        font: inherit;
        padding: 4px 8px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }
      .buckets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .buckets button {
        font: inherit;
        font-size: 13px;
        border: 1px solid #cbd5e1;
        background: #fff;
        padding: 4px 10px;
        border-radius: 999px;
        cursor: pointer;
        color: #334155;
      }
      .buckets button.active {
        background: #0f172a;
        color: #fff;
        border-color: #0f172a;
      }
      .editor {
        margin: 0 16px 12px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        overflow: hidden;
      }
      .editor-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 4px 0 12px;
        border-bottom: 1px solid #e2e8f0;
        background: #f8fafc;
      }
      .editor-head h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .tabs {
        display: flex;
      }
      .tabs button,
      .restore {
        font: inherit;
        font-size: 13px;
        border: 0;
        background: transparent;
        padding: 10px 12px;
        cursor: pointer;
        color: #475569;
      }
      .tabs button.active {
        color: #0f172a;
        font-weight: 600;
        box-shadow: inset 0 -2px 0 #0f172a;
      }
      .restore {
        color: #2563eb;
      }
      .restore[hidden] {
        display: none;
      }
      textarea {
        display: block;
        width: 100%;
        min-height: 220px;
        border: 0;
        padding: 10px 12px;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        resize: vertical;
        box-sizing: border-box;
        color: #0f172a;
        background: #fff;
      }
      textarea:focus {
        outline: none;
      }
      .parse-err {
        min-height: 1.2em;
        margin: 0;
        padding: 0 12px 8px;
        font-size: 12px;
        color: #b91c1c;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 0 16px 16px;
      }
      .pane {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        overflow: hidden;
      }
      .pane h2 {
        margin: 0;
        padding: 8px 12px;
        font-size: 13px;
        background: #f1f5f9;
        border-bottom: 1px solid #e2e8f0;
      }
      iframe {
        display: block;
        width: 100%;
        min-height: 80px;
        height: 80px;
        border: 0;
        overflow: hidden;
        background: #fff;
      }
      table {
        width: calc(100% - 32px);
        margin: 0 16px 24px;
        border-collapse: collapse;
        font-size: 13px;
        background: #fff;
      }
      th,
      td {
        border: 1px solid #e2e8f0;
        padding: 6px 8px;
        text-align: left;
      }
      .ok {
        color: #15803d;
      }
      .bad {
        color: #b91c1c;
      }
      .font-cell {
        max-width: 22em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .classify {
        margin: 0 16px 24px;
        padding: 12px 16px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-size: 13px;
      }
      .classify h2,
      .classify h3 {
        margin: 0 0 6px;
        font-size: 13px;
      }
      .classify h3 {
        margin-top: 10px;
      }
      .classify ul {
        margin: 0;
        padding-left: 1.2em;
      }
      .classify .advice {
        color: #475569;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>同一份 schema：Amis SDK vs Vamis SDK</h1>
      <p>
        两边都走 JS SDK（<code>amis.embed</code> / <code>vamis.embed</code>），用例按 Amis 侧栏分 <strong>文档 / 组件 / 样式</strong>。Vamis 可以比 Amis 多（尤其是样式），多出来的条目标 <code>+</code>。Amis SDK 默认
        <code>unpkg.com/amis@6.13.0</code>。编辑 Schema 是 YAML / JSON 两个 Tab，改一边立刻同步；解析失败时对侧与预览停在上一份能跑的
        schema。
      </p>
      <div class="toolbar">
        <div class="buckets" id="buckets">
          <button type="button" data-bucket="" class="active">全部</button>
          <button type="button" data-bucket="docs">文档</button>
          <button type="button" data-bucket="components">组件</button>
          <button type="button" data-bucket="style">样式</button>
        </div>
        <label>
          用例
          <select id="case"></select>
        </label>
        <p id="expect"></p>
      </div>
    </header>
    <section class="editor" aria-label="编辑 Schema">
      <div class="editor-head">
        <h2>编辑 Schema</h2>
        <div class="tabs">
          <button type="button" id="tab-yaml" class="active" data-kind="yaml">YAML</button>
          <button type="button" id="tab-json" data-kind="json">JSON</button>
          <button type="button" id="restore" class="restore" hidden>恢复用例</button>
        </div>
      </div>
      <textarea id="source" spellcheck="false" aria-label="Schema 源码"></textarea>
      <p class="parse-err" id="parse-err"></p>
    </section>
    <div class="grid">
      <section class="pane">
        <h2>Amis 6.13.0</h2>
        <iframe id="amis" title="Amis SDK" scrolling="no"></iframe>
      </section>
      <section class="pane">
        <h2>Vamis</h2>
        <iframe id="vamis" title="Vamis SDK" scrolling="no"></iframe>
      </section>
    </div>
    <table id="result">
      <thead></thead>
      <tbody></tbody>
    </table>
    <p id="diff-note" class="parse-err" style="padding: 0 16px 16px"></p>
    <section id="classify" class="classify" hidden>
      <h2>问题分类</h2>
      <div id="classify-body"></div>
    </section>
    <script src="https://unpkg.com/js-yaml@4.1.1/dist/js-yaml.min.js"></script>
    <script src="./compare-cases.js"></script>
    <script>
      ;(function () {
        function measureKind(measure) {
          return (measure && measure.type) || 'smoke'
        }
        function fontColumns() {
          return [
            { key: 'fontSize', label: '字号' },
            { key: 'lineHeight', label: '行高' },
            { key: 'fontFamily', label: '字体' },
          ]
        }
        function resultColumns(measure) {
          const type = measureKind(measure)
          const fonts = fontColumns()
          if (type === 'pair') {
            return [
              { key: 'sameRow', label: '同一行' },
              { key: 'gap', label: '缝 gap' },
              { key: 'box', label: '第二颗 top / left / 宽' },
            ].concat(fonts, [{ key: 'pass', label: '判定' }])
          }
          if (type === 'style') {
            const props = (measure && measure.props) || ['marginLeft', 'display']
            return props
              .map(function (prop) {
                return { key: 'style:' + prop, label: prop }
              })
              .concat(fonts, [{ key: 'pass', label: '判定' }])
          }
          return [{ key: 'status', label: '状态' }, { key: 'text', label: '摘要' }].concat(fonts, [
            { key: 'pass', label: '判定' },
          ])
        }
        function measureLabel(measure) {
          const type = measureKind(measure)
          if (type === 'pair') return '量测：盒模型（同一行 / 缝）'
          if (type === 'style') return '量测：计算样式'
          return '量测：渲染 smoke（两边都能画出即过）'
        }
        function px(value) {
          if (typeof value === 'number' && isFinite(value)) return value
          const n = parseFloat(String(value || ''))
          return isFinite(n) ? n : null
        }
        function scoreCase(row, amis, vamis) {
          if (vamis && vamis.error) return { pass: false, reason: 'vamis: ' + vamis.error, diffs: [] }
          if (amis && amis.error) return { pass: false, reason: 'amis: ' + amis.error, diffs: [] }
          const type = measureKind(row && row.measure)
          if (type === 'smoke') return { pass: true, diffs: [] }
          const a = (amis && amis.measure) || {}
          const b = (vamis && vamis.measure) || {}
          const diffs = []
          if (type === 'pair') {
            if (Boolean(a.sameRow) !== Boolean(b.sameRow)) diffs.push({ prop: 'sameRow', amis: a.sameRow, vamis: b.sameRow })
            const ag = px(a.gap)
            const bg = px(b.gap)
            if (ag == null || bg == null || Math.abs(ag - bg) > 1) diffs.push({ prop: 'gap', amis: a.gap, vamis: b.gap })
          }
          return { pass: diffs.length === 0, diffs: diffs }
        }
        const select = document.getElementById('case')
        const source = document.getElementById('source')
        const parseErr = document.getElementById('parse-err')
        const restore = document.getElementById('restore')
        const tabYaml = document.getElementById('tab-yaml')
        const tabJson = document.getElementById('tab-json')
        const params = new URLSearchParams(location.search)
        const amisSdk = params.get('amisSdk') || ''
        const yamlSchema = window.jsyaml ? window.jsyaml.CORE_SCHEMA : undefined
        let bucketFilter = params.get('bucket') || ''
        function allCases() {
          return window.VAMIS_COMPARE_CASES || []
        }
        function fillSelect(keepId) {
          const rows = allCases().filter(function (row) {
            return !bucketFilter || row.bucket === bucketFilter
          })
          const groups = {}
          const order = []
          rows.forEach(function (row) {
            const group = row.group || 'other'
            if (!groups[group]) {
              groups[group] = []
              order.push(group)
            }
            groups[group].push(row)
          })
          select.innerHTML = ''
          order.forEach(function (group) {
            const og = document.createElement('optgroup')
            og.label = group + '（' + groups[group].length + '）'
            groups[group].forEach(function (row) {
              const opt = document.createElement('option')
              opt.value = row.id
              opt.textContent = (row.extra ? '+ ' : '') + row.title
              og.appendChild(opt)
            })
            select.appendChild(og)
          })
          const want = keepId || params.get('case')
          if (want && rows.some(function (row) { return row.id === want })) select.value = want
        }
        fillSelect()
        document.getElementById('buckets').querySelectorAll('button').forEach(function (btn) {
          if ((btn.getAttribute('data-bucket') || '') === bucketFilter) btn.classList.add('active')
          else btn.classList.remove('active')
          btn.addEventListener('click', function () {
            bucketFilter = btn.getAttribute('data-bucket') || ''
            document.getElementById('buckets').querySelectorAll('button').forEach(function (other) {
              other.classList.toggle('active', other === btn)
            })
            const url = new URL(location.href)
            if (bucketFilter) url.searchParams.set('bucket', bucketFilter)
            else url.searchParams.delete('bucket')
            history.replaceState(null, '', url)
            fillSelect(select.value)
            applyCase()
          })
        })

        let kind = 'yaml'
        let yamlText = ''
        let jsonText = ''
        let lastGood = null
        let dirty = false
        let runId = 0
        let debounce = null
        const ready = { amis: false, vamis: false }
        const got = { amis: null, vamis: null }
        const frameH = { amis: 80, vamis: 80 }

        function readDocHeight(engine) {
          try {
            const frame = document.getElementById(engine)
            const doc = frame && frame.contentDocument
            const root = doc && doc.getElementById('root')
            if (!root) return 0
            const top = Math.max(0, root.getBoundingClientRect().top)
            return Math.ceil(root.scrollHeight + top + 2)
          } catch (_err) {
            return 0
          }
        }

        function applyFrameHeights() {
          const used = Math.max(
            80,
            frameH.amis || 80,
            frameH.vamis || 80,
            readDocHeight('amis'),
            readDocHeight('vamis'),
          )
          const capped = Math.min(used, 4000)
          document.getElementById('amis').style.height = capped + 'px'
          document.getElementById('vamis').style.height = capped + 'px'
        }

        function item() {
          return (window.VAMIS_COMPARE_CASES || []).find(function (row) {
            return row.id === select.value
          })
        }

        function dumpYaml(value) {
          if (window.jsyaml) {
            return window.jsyaml.dump(value, {
              schema: yamlSchema,
              lineWidth: -1,
              noRefs: true,
              quotingType: '"',
            })
          }
          return JSON.stringify(value, null, 2) + '\n'
        }

        function loadYaml(text) {
          const trimmed = text.trim()
          if (!trimmed) return {}
          if (trimmed.startsWith('{') || trimmed.startsWith('[')) return JSON.parse(trimmed)
          if (!window.jsyaml) throw new Error('YAML 解析需要 js-yaml')
          const value = window.jsyaml.load(trimmed, { schema: yamlSchema })
          return value == null ? {} : value
        }

        function widgetOf(value) {
          if (value && typeof value === 'object' && value.apiVersion && value.spec) return value.spec
          return value
        }

        function collectLabels(schema) {
          const labels = []
          function walk(node) {
            if (!node) return
            if (Array.isArray(node)) {
              node.forEach(walk)
              return
            }
            if (typeof node !== 'object') return
            const type = node.type
            if (
              (type === 'button' || type === 'action' || type === 'submit' || type === 'reset') &&
              node.label
            ) {
              labels.push(String(node.label))
            }
            walk(node.body)
            walk(node.buttons)
            walk(node.actions)
            walk(node.dialog)
          }
          walk(widgetOf(schema))
          if (labels.length >= 2) return labels.slice(0, 2)
          const preset = item()
          return (preset && preset.labels) || []
        }

        function frameUrl(engine) {
          const q = new URLSearchParams({ engine: engine })
          if (amisSdk) q.set('amisSdk', amisSdk)
          return './embed-case.html?' + q.toString()
        }

        function cellId(engine, key) {
          return engine + '-' + String(key).replace(/[^a-zA-Z0-9]+/g, '-')
        }

        function activeMeasure() {
          const row = item()
          if (!row) return { type: 'smoke' }
          if (!dirty) return row.measure || { type: 'smoke' }
          if (row.measure && row.measure.type === 'pair') {
            return { type: 'pair', labels: collectLabels(lastGood), selectors: row.measure.selectors }
          }
          return row.measure || { type: 'smoke' }
        }

        function layoutTable() {
          const cols = resultColumns(activeMeasure())
          const table = document.getElementById('result')
          const head = ['<tr><th></th>']
          cols.forEach(function (col) {
            head.push('<th>' + col.label + '</th>')
          })
          head.push('</tr>')
          table.querySelector('thead').innerHTML = head.join('')
          table.querySelector('tbody').innerHTML = ['amis', 'vamis']
            .map(function (engine) {
              const name = engine === 'amis' ? 'Amis' : 'Vamis'
              const cells = cols
                .map(function (col) {
                  return '<td id="' + cellId(engine, col.key) + '">…</td>'
                })
                .join('')
              return '<tr><td>' + name + '</td>' + cells + '</tr>'
            })
            .join('')
          document.getElementById('diff-note').textContent = ''
          document.getElementById('classify').hidden = true
          document.getElementById('classify-body').innerHTML = ''
        }

        function setCell(id, text, cls, title) {
          const el = document.getElementById(id)
          if (!el) return
          el.textContent = text
          el.className = cls || ''
          if (title) el.setAttribute('title', title)
          else el.removeAttribute('title')
        }

        function shortFamily(value) {
          if (!value) return '—'
          const parts = String(value)
            .split(',')
            .map(function (item) {
              return item.trim().replace(/^["']|["']$/g, '')
            })
            .filter(Boolean)
          const shown = parts.slice(0, 2).join(', ')
          return parts.length > 2 ? shown + '…' : shown
        }

        function firstFamily(value) {
          if (!value) return ''
          return String(value)
            .split(',')[0]
            .trim()
            .replace(/^["']|["']$/g, '')
            .toLowerCase()
        }

        function fontOf(payload) {
          return (payload && payload.measure && payload.measure.font) || {}
        }

        function rootFontOf(payload) {
          return (payload && payload.measure && payload.measure.rootFont) || {}
        }

        function faceName(font) {
          return font.used || firstFamily(font.fontFamily)
        }

        function cellValue(engine, key, payload) {
          if (payload.error) {
            if (key === 'status' || key === 'sameRow' || key === 'pass') {
              return { text: payload.error, cls: 'bad' }
            }
            if (key === 'text') return { text: '—', cls: '' }
            return { text: '—', cls: '' }
          }
          const m = payload.measure || {}
          const font = m.font || {}
          if (key === 'sameRow') return { text: m.sameRow ? '是' : '否', cls: m.sameRow ? 'ok' : 'bad' }
          if (key === 'gap') return { text: String(m.gap) + 'px', cls: '' }
          if (key === 'box') {
            return {
              text: m.b ? m.b.top + ' / ' + m.b.left + ' / ' + m.b.width : '—',
              cls: '',
            }
          }
          if (key === 'status') return { text: m.smoke ? '已渲染' : '已量测', cls: 'ok' }
          if (key === 'text') return { text: m.text || '—', cls: '' }
          if (key === 'fontSize') return { text: font.fontSize || '—', cls: '' }
          if (key === 'lineHeight') return { text: font.lineHeight || '—', cls: '' }
          if (key === 'fontFamily') {
            const used = faceName(font)
            const root = rootFontOf(payload)
            const rootUsed = faceName(root)
            const weight = font.fontWeight
            const label = used ? (weight ? weight + ' · ' + used : used) : '—'
            const extra = rootUsed && used && rootUsed.toLowerCase() !== used.toLowerCase() ? ' · body ' + rootUsed : ''
            return {
              text: label + extra,
              cls: 'font-cell',
              title: [used && 'used: ' + used, rootUsed && 'body: ' + rootUsed, font.fontFamily]
                .filter(Boolean)
                .join('\n'),
            }
          }
          if (key.indexOf('style:') === 0) {
            const prop = key.slice(6)
            return { text: (m.style && m.style[prop]) || '—', cls: '' }
          }
          if (key === 'pass') return { text: '…', cls: '' }
          return { text: '—', cls: '' }
        }

        function collectFontDiffs(amis, vamis) {
          const a = fontOf(amis)
          const b = fontOf(vamis)
          const ar = rootFontOf(amis)
          const br = rootFontOf(vamis)
          const diffs = []
          function add(prop, left, right, numeric) {
            if (numeric) {
              const ln = px(left)
              const rn = px(right)
              if (ln != null && rn != null) {
                if (Math.abs(ln - rn) > 0.5) diffs.push({ prop: prop, amis: left, vamis: right })
                return
              }
            }
            if (String(left || '').toLowerCase() !== String(right || '').toLowerCase()) {
              diffs.push({ prop: prop, amis: left, vamis: right })
            }
          }
          add('fontSize', a.fontSize, b.fontSize, true)
          add('lineHeight', a.lineHeight, b.lineHeight, true)
          add('fontWeight', a.fontWeight, b.fontWeight, false)
          add('fontFamily', faceName(a), faceName(b), false)
          add('bodyFont', faceName(ar), faceName(br), false)
          return diffs
        }

        const SCOPE = {
          global: { label: '全局', hint: 'html/body、SDK 根、主题 token。修一处会大面积变化。' },
          helper: { label: '样式 helper', hint: 'schema className 工具类，对标 Amis helper 计算样式。' },
          component: { label: '组件', hint: '某个 type 的默认外观，不要改全局 token。' },
        }
        const COMPACT_CLASS = /^(?:m|p)(?:-[trblxy])?(?:-(?:none|xs|sm|md|lg|xl|xxl|n|base))?$/
        const TYPE_SIZE_CLASS = /^(text|leading|tracking)-(xs|sm|base|md|lg|xl|[2-8]xl)$/

        function walkSchema(node, visit) {
          if (!node || typeof node !== 'object') return
          if (Array.isArray(node)) {
            node.forEach(function (item) {
              walkSchema(item, visit)
            })
            return
          }
          visit(node)
          walkSchema(node.body, visit)
          walkSchema(node.columns, visit)
          walkSchema(node.items, visit)
          walkSchema(node.buttons, visit)
          walkSchema(node.actions, visit)
          walkSchema(node.dialog, visit)
        }

        function collectClassNames(schema) {
          const out = []
          walkSchema(schema, function (node) {
            if (typeof node.className === 'string') out.push.apply(out, node.className.split(/\s+/).filter(Boolean))
            if (typeof node.tpl === 'string') {
              const re = /class(?:Name)?="([^"]+)"/g
              let match
              while ((match = re.exec(node.tpl))) out.push.apply(out, match[1].split(/\s+/).filter(Boolean))
            }
          })
          return out
        }

        function collectTypes(schema) {
          const out = []
          walkSchema(schema, function (node) {
            if (typeof node.type === 'string') out.push(node.type)
          })
          return out
        }

        function isZero(value) {
          const n = parseFloat(value)
          return isFinite(n) && n === 0
        }

        function classifyIssue(diff, row) {
          const prop = String((diff && diff.prop) || '')
          const classes = collectClassNames(row && row.schema)
          const types = collectTypes(row && row.schema)
          const compact = classes.filter(function (name) {
            return COMPACT_CLASS.test(name)
          })[0]
          if (prop === 'bodyFont' || prop === 'bodyFontSize') return 'global'
          if (prop === 'fontFamily' && !classes.some(function (name) {
            return name === 'font-sans' || name === 'font-serif' || name === 'font-mono'
          })) return 'global'
          if (prop === 'gap' || prop === 'marginLeft') {
            if (compact && isZero(diff.vamis) && !isZero(diff.amis)) return 'helper'
            if (compact) return 'global'
            if (classes.some(function (name) {
              return name.indexOf('space-') === 0 || name.indexOf('gap-') === 0
            })) return 'helper'
            return 'component'
          }
          if (prop === 'fontSize') {
            if (classes.some(function (name) {
              return TYPE_SIZE_CLASS.test(name)
            })) return 'helper'
            return 'global'
          }
          if (prop === 'fontWeight' || prop === 'lineHeight') {
            if (types.indexOf('button') >= 0 || types.indexOf('action') >= 0 || types.indexOf('submit') >= 0) {
              return 'component'
            }
            return 'component'
          }
          if (prop === 'sameRow') return 'component'
          return 'helper'
        }

        function adviseIssue(diff, row, scope) {
          const prop = String((diff && diff.prop) || '')
          const compact = collectClassNames(row && row.schema).filter(function (name) {
            return COMPACT_CLASS.test(name)
          })[0]
          if (scope === 'global' && (prop === 'bodyFont' || prop === 'fontFamily')) {
            return 'Amis SDK 把 html/body 钉成 PingFang SC；Vamis 走 --fonts-base-family 长栈。在 sdk 根 / embed 的 html,body 对齐中文默认栈。'
          }
          if (scope === 'global' && (prop === 'gap' || prop === 'marginLeft')) {
            return 'compact 阶应对齐 Amis 5/10/15/20/30/40/50。现在 --gap-* 是 4/8/12/16/20/24。改 token 一处，m/p 整阶回来。'
          }
          if (scope === 'helper' && (prop === 'gap' || prop === 'marginLeft')) {
            return '缺档：补 Amis 同名 helper（' + (compact || '该类') + '），不要用邻近档近似。'
          }
          if (scope === 'helper' && prop === 'fontSize') {
            return '对标 Amis helper 计算字号（text-sm 实测 12px，不是 0.875rem=14px）。'
          }
          if (scope === 'component' && prop === 'fontWeight') {
            return 'Button 默认字重：Amis 400，Vamis font-medium=500。改 button cva。'
          }
          if (scope === 'component' && prop === 'lineHeight') {
            return '控件行高跟该 type 默认走，不要改 html 行高。'
          }
          return SCOPE[scope] ? SCOPE[scope].hint : ''
        }

        function paintClassify(diffs) {
          const box = document.getElementById('classify')
          const body = document.getElementById('classify-body')
          if (!diffs.length) {
            box.hidden = true
            body.innerHTML = ''
            return
          }
          const groups = { global: [], helper: [], component: [] }
          const row = item()
          diffs.forEach(function (diff) {
            const scope = classifyIssue(diff, row)
            groups[scope].push({
              diff: diff,
              advice: adviseIssue(diff, row, scope),
            })
          })
          const html = ['global', 'helper', 'component']
            .filter(function (key) {
              return groups[key].length
            })
            .map(function (key) {
              const list = groups[key]
              const advice = []
              list.forEach(function (entry) {
                if (entry.advice && advice.indexOf(entry.advice) < 0) advice.push(entry.advice)
              })
              const items = list
                .map(function (entry) {
                  return (
                    '<li>' +
                    entry.diff.prop +
                    ': Amis ' +
                    entry.diff.amis +
                    ' / Vamis ' +
                    entry.diff.vamis +
                    '</li>'
                  )
                })
                .join('')
              return (
                '<h3>' +
                SCOPE[key].label +
                '（' +
                list.length +
                '）</h3><p class="advice">' +
                SCOPE[key].hint +
                '</p><ul>' +
                items +
                '</ul><p class="advice">整改：' +
                advice.join(' ') +
                '</p>'
              )
            })
            .join('')
          body.innerHTML = html
          box.hidden = false
        }

        function scoreParity() {
          if (!got.amis || !got.vamis) return
          if (dirty) {
            setCell(cellId('amis', 'pass'), '自编')
            setCell(cellId('vamis', 'pass'), '自编')
            paintClassify([])
            return
          }
          const result = scoreCase(item(), got.amis, got.vamis)
          const kind = (item().measure && item().measure.type) || 'smoke'
          const fontDiffs = collectFontDiffs(got.amis, got.vamis)
          if (kind === 'smoke') {
            if (!result.pass) {
              setCell(cellId('amis', 'pass'), '失败', 'bad')
              setCell(cellId('vamis', 'pass'), '失败', 'bad')
            } else if (fontDiffs.length) {
              setCell(cellId('amis', 'pass'), '对照', 'ok')
              setCell(cellId('vamis', 'pass'), '字体差', 'bad')
            } else {
              setCell(cellId('amis', 'pass'), '渲染', 'ok')
              setCell(cellId('vamis', 'pass'), '渲染', 'ok')
            }
          } else {
            setCell(cellId('amis', 'pass'), '对照', got.amis.error ? 'bad' : 'ok')
            setCell(
              cellId('vamis', 'pass'),
              result.pass ? '对齐' : '不对齐',
              result.pass ? 'ok' : 'bad',
            )
          }
          fontDiffs.forEach(function (diff) {
            const key =
              diff.prop === 'fontWeight' || diff.prop === 'bodyFont' ? 'fontFamily' : diff.prop
            const el = document.getElementById(cellId('vamis', key))
            if (el) el.classList.add('bad')
          })
          const geometry = (result.diffs || [])
            .map(function (diff) {
              return diff.prop + ': Amis ' + diff.amis + ' / Vamis ' + diff.vamis
            })
            .join('；')
          const fonts = fontDiffs
            .map(function (diff) {
              return diff.prop + ': Amis ' + diff.amis + ' / Vamis ' + diff.vamis
            })
            .join('；')
          const note = [geometry, fonts, result.reason].filter(Boolean).join('；')
          document.getElementById('diff-note').textContent = note
          const seen = {}
          const classified = []
          ;(result.diffs || []).concat(fontDiffs).forEach(function (diff) {
            if (!diff || !diff.prop || seen[diff.prop]) return
            seen[diff.prop] = true
            classified.push(diff)
          })
          paintClassify(classified)
        }

        function paint(engine, payload) {
          if (payload.runId != null && payload.runId !== runId) return
          got[engine] = payload
          resultColumns(activeMeasure()).forEach(function (col) {
            const value = cellValue(engine, col.key, payload)
            setCell(cellId(engine, col.key), value.text, value.cls, value.title)
          })
          scoreParity()
        }

        function sendTo(engine) {
          const frame = document.getElementById(engine)
          if (!ready[engine] || !frame.contentWindow || !lastGood) return
          const measure = activeMeasure()
          frame.contentWindow.postMessage(
            {
              type: 'vamis-compare-run',
              runId: runId,
              schema: lastGood,
              measure: measure,
              labels: measure.labels || collectLabels(lastGood),
              caseId: select.value,
            },
            '*',
          )
        }

        function sendRun() {
          runId += 1
          got.amis = null
          got.vamis = null
          frameH.amis = 80
          frameH.vamis = 80
          applyFrameHeights()
          layoutTable()
          ;['amis', 'vamis'].forEach(sendTo)
        }

        function applyCase(resetEditor) {
          const row = item()
          lastGood = JSON.parse(JSON.stringify(row.schema))
          dirty = false
          restore.hidden = true
          yamlText = dumpYaml(lastGood)
          jsonText = JSON.stringify(lastGood, null, 2) + '\n'
          if (resetEditor !== false) source.value = kind === 'yaml' ? yamlText : jsonText
          parseErr.textContent = ''
          const type = (row.measure && row.measure.type) || 'smoke'
          const hint = row.expect
            ? '期望：' + row.expect
            : type === 'smoke'
              ? '期望：两边都能渲染'
              : '期望：Vamis 对齐 Amis 实测'
          document.getElementById('expect').textContent = measureLabel(row.measure) + ' · ' + hint
          const next = new URL(location.href)
          next.searchParams.set('case', select.value)
          history.replaceState(null, '', next)
          sendRun()
        }

        function onSourceInput() {
          const text = source.value
          try {
            if (kind === 'json') {
              lastGood = JSON.parse(text.trim() || '{}')
              jsonText = text
              yamlText = dumpYaml(lastGood)
            } else {
              lastGood = loadYaml(text)
              yamlText = text
              jsonText = JSON.stringify(lastGood, null, 2) + '\n'
            }
            parseErr.textContent = ''
            dirty = JSON.stringify(lastGood) !== JSON.stringify(item().schema)
            restore.hidden = !dirty
            clearTimeout(debounce)
            debounce = setTimeout(sendRun, 400)
          } catch (err) {
            parseErr.textContent = String(err && err.message ? err.message : err)
          }
        }

        function setKind(next) {
          if (next === kind) return
          kind = next
          tabYaml.classList.toggle('active', kind === 'yaml')
          tabJson.classList.toggle('active', kind === 'json')
          source.value = kind === 'yaml' ? yamlText : jsonText
        }

        window.addEventListener('message', function (event) {
          const data = event.data
          if (!data) return
          if (data.type === 'vamis-compare-ready' && (data.engine === 'amis' || data.engine === 'vamis')) {
            ready[data.engine] = true
            sendTo(data.engine)
            return
          }
          if (data.type === 'vamis-compare' && (data.engine === 'amis' || data.engine === 'vamis')) {
            paint(data.engine, data)
            applyFrameHeights()
            return
          }
          if (data.type === 'vamis-compare-size' && (data.engine === 'amis' || data.engine === 'vamis')) {
            const height = Number(data.height)
            if (!Number.isFinite(height)) return
            frameH[data.engine] = Math.max(80, Math.min(Math.ceil(height), 4000))
            applyFrameHeights()
          }
        })

        tabYaml.addEventListener('click', function () {
          setKind('yaml')
        })
        tabJson.addEventListener('click', function () {
          setKind('json')
        })
        restore.addEventListener('click', function () {
          applyCase(true)
        })
        source.addEventListener('input', onSourceInput)
        select.addEventListener('change', function () {
          applyCase(true)
        })

        document.getElementById('amis').src = frameUrl('amis')
        document.getElementById('vamis').src = frameUrl('vamis')
        applyCase(true)
      })()
    </script>
  </body>
</html>
