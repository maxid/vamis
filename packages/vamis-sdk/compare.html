<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amis / Vamis SDK 对照</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #0f172a;
      }
      body {
        margin: 0;
        background: #f8fafc;
      }
      header {
        padding: 16px 20px 8px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 6px;
      }
      p,
      label {
        font-size: 13px;
        color: #475569;
      }
      select {
        font: inherit;
        padding: 4px 8px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }
      .editor {
        margin: 0 16px 12px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        overflow: hidden;
      }
      .editor-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0 4px 0 12px;
        border-bottom: 1px solid #e2e8f0;
        background: #f8fafc;
      }
      .editor-head h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .tabs {
        display: flex;
      }
      .tabs button,
      .restore {
        font: inherit;
        font-size: 13px;
        border: 0;
        background: transparent;
        padding: 10px 12px;
        cursor: pointer;
        color: #475569;
      }
      .tabs button.active {
        color: #0f172a;
        font-weight: 600;
        box-shadow: inset 0 -2px 0 #0f172a;
      }
      .restore {
        color: #2563eb;
      }
      .restore[hidden] {
        display: none;
      }
      textarea {
        display: block;
        width: 100%;
        min-height: 220px;
        border: 0;
        padding: 10px 12px;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        resize: vertical;
        box-sizing: border-box;
        color: #0f172a;
        background: #fff;
      }
      textarea:focus {
        outline: none;
      }
      .parse-err {
        min-height: 1.2em;
        margin: 0;
        padding: 0 12px 8px;
        font-size: 12px;
        color: #b91c1c;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 0 16px 16px;
      }
      .pane {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        overflow: hidden;
      }
      .pane h2 {
        margin: 0;
        padding: 8px 12px;
        font-size: 13px;
        background: #f1f5f9;
        border-bottom: 1px solid #e2e8f0;
      }
      iframe {
        width: 100%;
        height: 220px;
        border: 0;
        background: #fff;
      }
      table {
        width: calc(100% - 32px);
        margin: 0 16px 24px;
        border-collapse: collapse;
        font-size: 13px;
        background: #fff;
      }
      th,
      td {
        border: 1px solid #e2e8f0;
        padding: 6px 8px;
        text-align: left;
      }
      .ok {
        color: #15803d;
      }
      .bad {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>同一份 schema：Amis SDK vs Vamis SDK</h1>
      <p>
        两边都走 JS SDK（<code>amis.embed</code> / <code>vamis.embed</code>），量的是真实按钮盒子，不是文档站截图。Amis SDK 默认
        <code>unpkg.com/amis@6.13.0</code>。编辑 Schema 是 YAML / JSON 两个 Tab，改一边立刻同步；解析失败时对侧与预览停在上一份能跑的
        schema。
      </p>
      <div class="toolbar">
        <label>
          用例
          <select id="case"></select>
        </label>
        <p id="expect"></p>
      </div>
    </header>
    <section class="editor" aria-label="编辑 Schema">
      <div class="editor-head">
        <h2>编辑 Schema</h2>
        <div class="tabs">
          <button type="button" id="tab-yaml" class="active" data-kind="yaml">YAML</button>
          <button type="button" id="tab-json" data-kind="json">JSON</button>
          <button type="button" id="restore" class="restore" hidden>恢复用例</button>
        </div>
      </div>
      <textarea id="source" spellcheck="false" aria-label="Schema 源码"></textarea>
      <p class="parse-err" id="parse-err"></p>
    </section>
    <div class="grid">
      <section class="pane">
        <h2>Amis 6.13.0</h2>
        <iframe id="amis" title="Amis SDK"></iframe>
      </section>
      <section class="pane">
        <h2>Vamis</h2>
        <iframe id="vamis" title="Vamis SDK"></iframe>
      </section>
    </div>
    <table>
      <thead>
        <tr>
          <th></th>
          <th>同一行</th>
          <th>缝 gap</th>
          <th>第二颗 top/left/宽</th>
          <th>判定</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Amis</td>
          <td id="amis-row">…</td>
          <td id="amis-gap">…</td>
          <td id="amis-box">…</td>
          <td id="amis-pass">…</td>
        </tr>
        <tr>
          <td>Vamis</td>
          <td id="vamis-row">…</td>
          <td id="vamis-gap">…</td>
          <td id="vamis-box">…</td>
          <td id="vamis-pass">…</td>
        </tr>
      </tbody>
    </table>
    <script src="https://unpkg.com/js-yaml@4.1.1/dist/js-yaml.min.js"></script>
    <script src="./compare-cases.js"></script>
    <script>
      (function () {
        const select = document.getElementById('case')
        const source = document.getElementById('source')
        const parseErr = document.getElementById('parse-err')
        const restore = document.getElementById('restore')
        const tabYaml = document.getElementById('tab-yaml')
        const tabJson = document.getElementById('tab-json')
        const params = new URLSearchParams(location.search)
        const amisSdk = params.get('amisSdk') || ''
        const yamlSchema = window.jsyaml ? window.jsyaml.CORE_SCHEMA : undefined
        ;(window.VAMIS_COMPARE_CASES || []).forEach(function (row) {
          const opt = document.createElement('option')
          opt.value = row.id
          opt.textContent = row.title
          select.appendChild(opt)
        })
        const initial = params.get('case')
        if (initial) select.value = initial

        let kind = 'yaml'
        let yamlText = ''
        let jsonText = ''
        let lastGood = null
        let dirty = false
        let runId = 0
        let debounce = null
        const ready = { amis: false, vamis: false }
        const got = { amis: null, vamis: null }

        function item() {
          return (window.VAMIS_COMPARE_CASES || []).find(function (row) {
            return row.id === select.value
          })
        }

        function dumpYaml(value) {
          if (window.jsyaml) {
            return window.jsyaml.dump(value, {
              schema: yamlSchema,
              lineWidth: -1,
              noRefs: true,
              quotingType: '"',
            })
          }
          return JSON.stringify(value, null, 2) + '\n'
        }

        function loadYaml(text) {
          const trimmed = text.trim()
          if (!trimmed) return {}
          if (trimmed.startsWith('{') || trimmed.startsWith('[')) return JSON.parse(trimmed)
          if (!window.jsyaml) throw new Error('YAML 解析需要 js-yaml')
          const value = window.jsyaml.load(trimmed, { schema: yamlSchema })
          return value == null ? {} : value
        }

        function widgetOf(value) {
          if (value && typeof value === 'object' && value.apiVersion && value.spec) return value.spec
          return value
        }

        function collectLabels(schema) {
          const labels = []
          function walk(node) {
            if (!node) return
            if (Array.isArray(node)) {
              node.forEach(walk)
              return
            }
            if (typeof node !== 'object') return
            const type = node.type
            if (
              (type === 'button' || type === 'action' || type === 'submit' || type === 'reset') &&
              node.label
            ) {
              labels.push(String(node.label))
            }
            walk(node.body)
            walk(node.buttons)
            walk(node.actions)
            walk(node.dialog)
          }
          walk(widgetOf(schema))
          if (labels.length >= 2) return labels.slice(0, 2)
          const preset = item()
          return (preset && preset.labels) || []
        }

        function frameUrl(engine) {
          const q = new URLSearchParams({ engine: engine })
          if (amisSdk) q.set('amisSdk', amisSdk)
          return './embed-case.html?' + q.toString()
        }

        function setCell(id, text, cls) {
          const el = document.getElementById(id)
          el.textContent = text
          el.className = cls || ''
        }

        function paint(engine, payload) {
          if (payload.runId != null && payload.runId !== runId) return
          got[engine] = payload
          const prefix = engine
          if (payload.error || !payload.measure) {
            setCell(prefix + '-row', payload.error || '未量到', 'bad')
            setCell(prefix + '-gap', '—')
            setCell(prefix + '-box', '—')
            setCell(prefix + '-pass', dirty ? '自编' : '失败', payload.error ? 'bad' : '')
            return
          }
          const m = payload.measure
          setCell(prefix + '-row', m.sameRow ? '是' : '否', m.sameRow ? 'ok' : 'bad')
          setCell(prefix + '-gap', String(m.gap) + 'px')
          setCell(prefix + '-box', m.b.top + ' / ' + m.b.left + ' / ' + m.b.width)
          if (dirty) {
            setCell(prefix + '-pass', '自编')
            return
          }
          const ok = item().pass(m)
          setCell(prefix + '-pass', ok ? '通过' : '失败', ok ? 'ok' : 'bad')
        }

        function sendTo(engine) {
          const frame = document.getElementById(engine)
          if (!ready[engine] || !frame.contentWindow || !lastGood) return
          frame.contentWindow.postMessage(
            {
              type: 'vamis-compare-run',
              runId: runId,
              schema: lastGood,
              labels: collectLabels(lastGood),
              caseId: select.value,
            },
            '*',
          )
        }

        function sendRun() {
          runId += 1
          ;['amis', 'vamis'].forEach(function (engine) {
            setCell(engine + '-row', '…')
            setCell(engine + '-gap', '…')
            setCell(engine + '-box', '…')
            setCell(engine + '-pass', '…')
            sendTo(engine)
          })
        }

        function applyCase(resetEditor) {
          const row = item()
          lastGood = JSON.parse(JSON.stringify(row.schema))
          dirty = false
          restore.hidden = true
          yamlText = dumpYaml(lastGood)
          jsonText = JSON.stringify(lastGood, null, 2) + '\n'
          if (resetEditor !== false) source.value = kind === 'yaml' ? yamlText : jsonText
          parseErr.textContent = ''
          document.getElementById('expect').textContent = '期望：' + row.expect
          const next = new URL(location.href)
          next.searchParams.set('case', select.value)
          history.replaceState(null, '', next)
          sendRun()
        }

        function onSourceInput() {
          const text = source.value
          try {
            if (kind === 'json') {
              lastGood = JSON.parse(text.trim() || '{}')
              jsonText = text
              yamlText = dumpYaml(lastGood)
            } else {
              lastGood = loadYaml(text)
              yamlText = text
              jsonText = JSON.stringify(lastGood, null, 2) + '\n'
            }
            parseErr.textContent = ''
            dirty = JSON.stringify(lastGood) !== JSON.stringify(item().schema)
            restore.hidden = !dirty
            clearTimeout(debounce)
            debounce = setTimeout(sendRun, 400)
          } catch (err) {
            parseErr.textContent = String(err && err.message ? err.message : err)
          }
        }

        function setKind(next) {
          if (next === kind) return
          kind = next
          tabYaml.classList.toggle('active', kind === 'yaml')
          tabJson.classList.toggle('active', kind === 'json')
          source.value = kind === 'yaml' ? yamlText : jsonText
        }

        window.addEventListener('message', function (event) {
          const data = event.data
          if (!data) return
          if (data.type === 'vamis-compare-ready' && (data.engine === 'amis' || data.engine === 'vamis')) {
            ready[data.engine] = true
            sendTo(data.engine)
            return
          }
          if (data.type === 'vamis-compare' && (data.engine === 'amis' || data.engine === 'vamis')) {
            paint(data.engine, data)
          }
        })

        tabYaml.addEventListener('click', function () {
          setKind('yaml')
        })
        tabJson.addEventListener('click', function () {
          setKind('json')
        })
        restore.addEventListener('click', function () {
          applyCase(true)
        })
        source.addEventListener('input', onSourceInput)
        select.addEventListener('change', function () {
          applyCase(true)
        })

        document.getElementById('amis').src = frameUrl('amis')
        document.getElementById('vamis').src = frameUrl('vamis')
        applyCase(true)
      })()
    </script>
  </body>
</html>
