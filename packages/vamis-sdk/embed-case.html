<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>compare frame</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        min-height: 100%;
        background: #fff;
        overflow-x: hidden;
        overflow-y: auto;
      }
      #root {
        padding: 12px;
        min-height: 100%;
        box-sizing: border-box;
      }
      .err {
        color: #b91c1c;
        font: 13px/1.4 system-ui;
        padding: 12px;
      }
    </style>
    <script>
      (function () {
        const params = new URLSearchParams(location.search)
        const engine = params.get('engine') || 'vamis'
        const forceMobile = params.get('vp') === 'mobile'
        const amisSdk = (params.get('amisSdk') || 'https://unpkg.com/amis@6.13.0/sdk').replace(
          /\/?$/,
          '/',
        )
        /**
         * 手机「桌面式网站」会把 CSS 视口撑到 ~980，matchMedia(768) 变桌面月历。
         * 顶层 ?vp=mobile 才强制移动端：钉 viewport 375 + env.mobileUI。
         * 不要靠 UA 去对抗桌面式。对照 iframe 本身已是 375，多带 vp 只是兜底。
         */
        if (forceMobile) {
          document.documentElement.classList.add('vamis-mobile-ui')
          const vpMeta = document.querySelector('meta[name="viewport"]')
          if (vpMeta) vpMeta.setAttribute('content', 'width=375, initial-scale=1')
        }
        /** 手机 WebView 会把 `./sdk.css` 解析成站点根 `/sdk.css`（404）。一律按 URL 里的 `/sdk/` 拼绝对地址。 */
        function sdkBase() {
          const path = location.pathname || '/'
          const marker = '/sdk/'
          const i = path.lastIndexOf(marker)
          if (i >= 0) return path.slice(0, i + marker.length)
          if (path === '/sdk' || /\/sdk$/.test(path)) return path + '/'
          return path.replace(/[^/]*$/, '') || '/'
        }
        function sdkFile(name) {
          // 占位由 serveSdk / sdk:build 换成产物 mtime。写死日期的话 sdk:build 后对照仍吃旧包。
          const stamp = '__VAMIS_SDK_V__'
          try {
            const href = new URL(name, location.origin + sdkBase())
            href.searchParams.set('v', stamp)
            return href.href
          } catch (_err) {
            return sdkBase() + name + '?v=' + stamp
          }
        }
        const css =
          engine === 'amis'
            ? [amisSdk + 'sdk.css', amisSdk + 'helper.css', amisSdk + 'iconfont.css']
            : [sdkFile('sdk.css')]
        const js = engine === 'amis' ? amisSdk + 'sdk.js' : sdkFile('sdk.js')
        const cssEls = css.map(function (href) {
          const el = document.createElement('link')
          el.rel = 'stylesheet'
          el.href = href
          document.head.appendChild(el)
          return el
        })
        const jsEl = document.createElement('script')
        jsEl.src = js
        jsEl.async = false
        document.head.appendChild(jsEl)
        window.__vamisCompareAssets = {
          engine: engine,
          amisSdk: amisSdk.replace(/\/$/, ''),
          cssEls: cssEls,
          jsEl: jsEl,
          mobileUI: forceMobile,
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const assets = window.__vamisCompareAssets || {}
        const engine = assets.engine || 'vamis'
        const forceMobile = assets.mobileUI === true
        let ready = false
        let pending = null
        let scoped = null
        let runId = 0

        function failBoot(message) {
          document.getElementById('root').innerHTML = '<p class="err"></p>'
          document.querySelector('.err').textContent = message
          parent.postMessage(
            { type: 'vamis-compare', engine: engine, runId: runId, error: message },
            '*',
          )
        }

        function waitAsset(el, kind) {
          return new Promise(function (resolve, reject) {
            const href = el.href || el.src || ''
            let settled = false
            const timer = setTimeout(function () {
              done(new Error(kind + ' timeout ' + href))
            }, 120000)
            function done(err) {
              if (settled) return
              settled = true
              clearTimeout(timer)
              if (err) reject(err)
              else resolve()
            }
            function fail() {
              done(new Error(kind + ' ' + href))
            }
            if (kind === 'css') {
              try {
                if (el.sheet) return done()
              } catch (_err) {
                return done()
              }
              el.addEventListener('load', function () {
                done()
              })
              el.addEventListener('error', fail)
              return
            }
            if (engine === 'amis') {
              if (typeof window.amisRequire === 'function') return done()
              el.addEventListener('load', function () {
                done()
              })
              el.addEventListener('error', fail)
              return
            }
            if (window.__vamisSdkReady) return done()
            function onReady() {
              window.removeEventListener('vamis-sdk-ready', onReady)
              done()
            }
            window.addEventListener('vamis-sdk-ready', onReady)
            el.addEventListener('error', fail)
          })
        }

        function findByLabel(label) {
          const wanted = String(label || '').replace(/\s+/g, ' ').trim()
          if (!wanted) return null
          const all = document.querySelectorAll('button, a, [role="button"], .cxd-Button, .cxd-Action')
          for (let i = 0; i < all.length; i++) {
            const text = (all[i].textContent || '').replace(/\s+/g, ' ').trim()
            if (text === wanted) return all[i]
          }
          return null
        }

        function pairNodes(spec) {
          if (spec && spec.selectors && spec.selectors.length >= 2) {
            return [document.querySelector(spec.selectors[0]), document.querySelector(spec.selectors[1])]
          }
          const wanted = (spec && spec.labels) || []
          if (wanted.length >= 2) return [findByLabel(wanted[0]), findByLabel(wanted[1])]
          const all = []
          const nodes = document.querySelectorAll('button, a, [data-box]')
          for (let i = 0; i < nodes.length && all.length < 2; i++) {
            if ((nodes[i].textContent || '').trim() || nodes[i].hasAttribute('data-box')) all.push(nodes[i])
          }
          return [all[0], all[1]]
        }

        function parseFamilies(value) {
          return String(value || '')
            .split(',')
            .map(function (item) {
              return item.trim().replace(/^["']|["']$/g, '')
            })
            .filter(Boolean)
        }

        function resolveUsed(el, cs) {
          const families = parseFamilies(cs.fontFamily)
          if (!families.length) return ''
          if (families.length === 1) return families[0]
          const canvas = document.createElement('canvas')
          const ctx = canvas.getContext('2d')
          if (!ctx) return families[0]
          const sample = ((el.textContent || '') + 'mmmmmmmmmmlli汉字')
            .replace(/\s+/g, '')
            .slice(0, 32)
          function width(fontSpec) {
            ctx.font = [cs.fontStyle, cs.fontWeight, cs.fontSize, fontSpec].join(' ')
            return ctx.measureText(sample).width
          }
          const full = width(cs.fontFamily)
          for (let i = 0; i < families.length; i++) {
            const name = families[i]
            const quoted = /[^a-zA-Z0-9-]/.test(name) ? '"' + name + '"' : name
            if (Math.abs(width(quoted) - full) < 0.5) return name
          }
          return families[0]
        }

        function readFont(el) {
          if (!el) return null
          const cs = getComputedStyle(el)
          return {
            fontFamily: cs.fontFamily,
            fontSize: cs.fontSize,
            fontWeight: cs.fontWeight,
            lineHeight: cs.lineHeight,
            used: resolveUsed(el, cs),
          }
        }

        function textTarget(root) {
          if (!root) return null
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
            acceptNode: function (node) {
              if (!node.nodeValue || !String(node.nodeValue).trim()) return NodeFilter.FILTER_REJECT
              const parent = node.parentElement
              if (!parent || parent.closest('.err')) return NodeFilter.FILTER_REJECT
              return NodeFilter.FILTER_ACCEPT
            },
          })
          const text = walker.nextNode()
          return (text && text.parentElement) || root.firstElementChild
        }

        var TREE_CHILD_KEYS = [
          'aside',
          'header',
          'toolbar',
          'headerToolbar',
          'body',
          'controls',
          'columns',
          'items',
          'tabs',
          'filter',
          'footer',
          'footerToolbar',
          'buttons',
          'actions',
          'bulkActions',
          'itemActions',
        ]
        var TREE_LAYOUT = {
          page: 1,
          container: 1,
          wrapper: 1,
          service: 1,
          form: 1,
          grid: 1,
          hbox: 1,
          vbox: 1,
          flex: 1,
          'pagination-wrapper': 1,
          panel: 1,
          collapse: 1,
          'collapse-group': 1,
          tabs: 1,
          tab: 1,
          fieldset: 1,
          group: 1,
          card: 1,
          portlet: 1,
          'switch-container': 1,
          wizard: 1,
          each: 1,
        }
        var SKIP_PROBE = { ajax: 1, link: 1, url: 1, email: 1, download: 1, copy: 1, reload: 1, submit: 1 }
        var SKIP_PROBE_EVENT = { mouseenter: 1, mouseleave: 1 }
        var ACTION_TYPES = { action: 1, button: 1, submit: 1, reset: 1 }

        function shouldProbe(actions) {
          // 事件链里带 ajax 的结果取决于后端；静态对照服 404 会让两边动作链停在不同的地方。
          if (
            actions.some(function (item) {
              const text = typeof item === 'string' ? item : ''
              const split = text.indexOf(':')
              return (split >= 0 ? text.slice(split + 1) : text) === 'ajax'
            })
          ) {
            return false
          }
          return actions.some(function (item) {
            const text = typeof item === 'string' ? item : ''
            const split = text.indexOf(':')
            const event = split >= 0 ? text.slice(0, split) : 'click'
            if (SKIP_PROBE_EVENT[event]) return false
            const action = split >= 0 ? text.slice(split + 1) : text
            return !SKIP_PROBE[action]
          })
        }

        function isSchemaNode(value) {
          return !!(value && typeof value === 'object' && !Array.isArray(value) && typeof value.type === 'string')
        }

        function collectNodeActions(node) {
          const out = []
          if (typeof node.actionType === 'string') out.push(node.actionType)
          if (node.action && typeof node.action.actionType === 'string') out.push(node.action.actionType)
          const events = node.onEvent && typeof node.onEvent === 'object' ? node.onEvent : {}
          Object.keys(events).forEach(function (event) {
            const list = events[event] && events[event].actions
            const actions = Array.isArray(list) ? list : list ? [list] : []
            actions.forEach(function (action) {
              if (action && typeof action.actionType === 'string') out.push(event + ':' + action.actionType)
            })
          })
          return out
        }

        function walkSchemaTree(schema) {
          const out = []
          let actionIndex = 0
          function visit(node, path) {
            if (!isSchemaNode(node) || out.length >= 80) return
            const name = node.name != null && node.name !== '' ? String(node.name) : ''
            const actions = collectNodeActions(node)
            const events = node.onEvent && typeof node.onEvent === 'object' ? Object.keys(node.onEvent) : []
            const isAction = !!ACTION_TYPES[node.type]
            out.push({
              path: path,
              type: node.type,
              name: name,
              id: node.id != null && node.id !== '' ? String(node.id) : '',
              label: node.label != null ? String(node.label) : '',
              schemaValue: node.value !== undefined ? node.value : node.defaultValue,
              events: events,
              actions: actions,
              actionIndex: isAction ? actionIndex++ : -1,
              probe: shouldProbe(actions),
            })
            TREE_CHILD_KEYS.forEach(function (key) {
              const child = node[key]
              if (child == null) return
              const list = Array.isArray(child) ? child : [child]
              list.forEach(function (item, index) {
                if (isSchemaNode(item)) visit(item, path + '/' + key + '/' + index + ':' + item.type)
              })
            })
          }
          const root = schema && schema.apiVersion && schema.spec ? schema.spec : schema
          if (Array.isArray(root)) {
            root.forEach(function (item, index) {
              if (isSchemaNode(item)) visit(item, index + ':' + item.type)
            })
          } else if (isSchemaNode(root)) visit(root, root.type)
          return out
        }

        function cssEscapeName(name) {
          if (window.CSS && CSS.escape) return CSS.escape(name)
          return String(name).replace(/"/g, '\\"')
        }

        function actionClickTarget(el) {
          if (!el) return null
          if (el.matches && el.matches('button, a, [role="button"]')) return el
          const inner = el.querySelector && el.querySelector('button, a, [role="button"]')
          return inner || el
        }

        function findNodeEl(node) {
          if (node.name) {
            const named = document.querySelector('[name="' + cssEscapeName(node.name) + '"]')
            if (named) return named
            // Amis 表单项不把 name 传到 input，但两端外壳都带 data-amis-name / data-name。
            // 开关 / 勾选 / 单选按外壳里的原生控件定位，避免 schema 带 id 时只命中 Vamis 包装层。
            if (node.type === 'switch' || node.type === 'checkbox' || node.type === 'radio') {
              const esc = cssEscapeName(node.name)
              const item = document.querySelector(
                '[data-amis-name="' + esc + '"], [data-name="' + esc + '"]'
              )
              const control = item && item.querySelector('input[type="checkbox"], input[type="radio"]')
              if (control) return control
            }
            if (node.type === 'input-file' || node.type === 'input-image') {
              const esc = cssEscapeName(node.name)
              const item = document.querySelector(
                '[data-amis-name="' + esc + '"], [data-name="' + esc + '"]'
              )
              const control = item && item.querySelector('input[type="file"]')
              if (control) return control
            }
          }
          if (node.id) {
            const byId = document.getElementById(node.id)
            if (byId) return byId
          }
          if (node.label) {
            const byLabel = findByLabel(node.label)
            if (byLabel) return byLabel
          }
          if (ACTION_TYPES[node.type]) {
            const vam = document.querySelectorAll('[data-vamis-action]')
            const buttons = vam.length
              ? vam
              : document.querySelectorAll('button, a.cxd-Button, .cxd-Button, .cxd-Action')
            if (typeof node.actionIndex === 'number' && node.actionIndex >= 0 && buttons[node.actionIndex]) {
              return actionClickTarget(buttons[node.actionIndex])
            }
            if (buttons.length === 1) return actionClickTarget(buttons[0])
          }
          if (node.type === 'avatar') {
            return document.querySelector('[data-vamis-avatar], .cxd-Avatar')
          }
          if (node.type === 'tasks') {
            return document.querySelector('[data-vamis-tasks], .cxd-Table-content')
          }
          if (node.type === 'audio') {
            return document.querySelector('[data-vamis-audio], .cxd-Audio')
          }
          if (node.type === 'wizard') {
            return document.querySelector('[data-vamis-wizard], .cxd-Wizard')
          }
          if (node.type === 'popover' || node.popOver) {
            return document.querySelector('[data-vamis-popover], .cxd-Field-popOverBtn, .cxd-PopOverAble')
          }
          if (node.badge) {
            return document.querySelector('[data-vamis-badge], .cxd-Badge-text, .cxd-Badge-dot, .cxd-Badge-ribbon')
          }
          return null
        }

        function readInputValue(el) {
          if (!el) return undefined
          const tag = (el.tagName || '').toLowerCase()
          const type = (el.type || '').toLowerCase()
          if (type === 'checkbox' || type === 'radio') return el.checked
          if (tag === 'select' && el.multiple) {
            return Array.prototype.map.call(el.selectedOptions || [], function (opt) {
              return opt.value
            })
          }
          if ('value' in el && tag !== 'button') return el.value
          return (el.textContent || '').trim() || undefined
        }

        function collectFormData() {
          const data = {}
          function absorb(bag) {
            if (!bag || typeof bag !== 'object' || Array.isArray(bag)) return
            Object.keys(bag).forEach(function (key) {
              if (key.charAt(0) === '_') return
              if (data[key] === undefined) data[key] = bag[key]
            })
          }
          const list =
            (scoped && typeof scoped.getComponents === 'function' && scoped.getComponents()) ||
            (scoped && scoped.components) ||
            []
          for (let i = 0; i < list.length; i++) {
            const comp = list[i]
            if (!comp) continue
            if (typeof comp.getData === 'function') {
              try {
                absorb(comp.getData())
              } catch (_err) {}
            }
            if (comp.props && comp.props.data) absorb(comp.props.data)
            if (comp.props && comp.props.store && comp.props.store.data) absorb(comp.props.store.data)
            if (comp.props && 'value' in comp.props && comp.props.name) {
              data[comp.props.name] = comp.props.value
            }
          }
          return data
        }

        function readComponent(node) {
          if (!scoped || !node.name || typeof scoped.getComponentByName !== 'function') return null
          try {
            return scoped.getComponentByName(node.name) || null
          } catch (_err) {
            return null
          }
        }

        function readNodeValue(node, formData) {
          // static-image / static-images 是展示字段：Amis 不从表单域回读，统一用 schemaValue。
          if (node.type === 'static-image' || node.type === 'static-images') return node.schemaValue
          // 文件/图片输入的原生 input 才是真实控件值；别把表单域里 Amis 不暴露的初始值读成差异。
          if (node.type === 'input-file' || node.type === 'input-image') {
            const control = findNodeEl(node)
            if (control && 'value' in control) return control.value
          }
          const comp = readComponent(node)
          if (comp) {
            if (typeof comp.getValue === 'function') {
              try {
                return comp.getValue()
              } catch (_err) {}
            }
            if (typeof comp.getData === 'function') {
              try {
                const bag = comp.getData()
                if (node.name && bag && typeof bag === 'object' && node.name in bag) return bag[node.name]
                if (bag && typeof bag === 'object' && !Array.isArray(bag) && Object.keys(bag).length && !node.name) {
                  return bag
                }
              } catch (_err) {}
            }
            if (comp.props && 'value' in comp.props) return comp.props.value
          }
          if (node.name && formData && node.name in formData) return formData[node.name]
          if (ACTION_TYPES[node.type]) return node.schemaValue
          // 布局容器没有控件值；Vamis 包装层 textContent 不是表单值（Amis 也不读）。
          if (TREE_LAYOUT[node.type]) return node.schemaValue
          const el = findNodeEl(node)
          if (el && (node.type === 'avatar' || node.type === 'tasks' || node.type === 'audio' || node.type === 'wizard')) {
            const text = (el.textContent || '').replace(/\s+/g, ' ').trim()
            if (text) return text
          }
          const fromDom = readInputValue(el)
          if (fromDom !== undefined) return fromDom
          return node.schemaValue
        }

        /** 交互后的值：开关 / 勾选 / 单选直接读原生控件，别走可能过期的 formData。 */
        function readProbeValue(node) {
          if (node.type === 'switch' || node.type === 'checkbox' || node.type === 'radio') {
            const el = findNodeEl(node)
            if (el && typeof el.checked === 'boolean') return el.checked
          }
          return readNodeValue(node, collectFormData())
        }

        function nodeRendered(node) {
          if (TREE_LAYOUT[node.type]) {
            const root = document.getElementById('root')
            return !!(root && root.childElementCount)
          }
          return !!findNodeEl(node)
        }

        function dialogOpen() {
          return !!(
            document.querySelector('[role="dialog"]:not(.vamis-popup):not(.vamis-date-sheet)') ||
            document.querySelector('[data-slot="dialog-content"]') ||
            document.querySelector('[data-slot="sheet-content"]') ||
            document.querySelector('[data-vamis-overlay]') ||
            document.querySelector('.cxd-Modal') ||
            document.querySelector('.cxd-Drawer') ||
            document.querySelector('.cxd-Dialog')
          )
        }

        /** 上一用例的 toast 可能还挂在 store / body 上；每个用例量测前清掉，避免跨用例假红。 */
        function clearToasts() {
          document
            .querySelectorAll(
              '.vamis-toast, [data-sonner-toast], .cxd-Toast, .cxd-Notification, [data-state="open"][data-slot="toast"]'
            )
            .forEach(function (el) {
              el.remove()
            })
        }

        function toastOpen() {
          return !!(
            document.querySelector('.vamis-toast') ||
            document.querySelector('[data-sonner-toast]') ||
            document.querySelector('.cxd-Toast') ||
            document.querySelector('.cxd-Notification') ||
            document.querySelector('[data-state="open"][data-slot="toast"]')
          )
        }

        function closeDialog() {
          const close =
            document.querySelector('[data-vamis-overlay] button') ||
            document.querySelector('[role="dialog"]:not(.vamis-popup):not(.vamis-date-sheet) button') ||
            document.querySelector('[data-slot="dialog-content"] button') ||
            document.querySelector('[data-slot="sheet-content"] button') ||
            document.querySelector('.cxd-Modal-close') ||
            document.querySelector('.cxd-Drawer-close') ||
            document.querySelector('.cxd-Dialog-close')
          if (close) close.click()
        }

        function sleep(ms) {
          return new Promise(function (resolve) {
            setTimeout(resolve, ms)
          })
        }

        function waitForText(timeout) {
          return new Promise(function (resolve) {
            const start = Date.now()
            function tick() {
              const root = document.getElementById('root')
              const text = root && (root.innerText || '').replace(/\s+/g, ' ').trim()
              if (text || Date.now() - start > timeout) {
                resolve()
                return
              }
              setTimeout(tick, 50)
            }
            tick()
          })
        }

        async function probeTree(nodes) {
          let used = 0
          for (let i = 0; i < nodes.length && used < 4; i++) {
            const node = nodes[i]
            if (!node.probe) continue
            const actions = node.actions || []
            const wantsDialog = actions.some(function (item) {
              return (
                item === 'dialog' ||
                item === 'drawer' ||
                item.indexOf(':dialog') >= 0 ||
                item.indexOf(':drawer') >= 0
              )
            })
            const wantsToast = actions.some(function (item) {
              return item === 'toast' || item.indexOf(':toast') >= 0
            })
            const wantsSetValue = actions.some(function (item) {
              return item === 'setValue' || item.indexOf(':setValue') >= 0
            })
            if (!wantsDialog && !wantsToast && !wantsSetValue) continue
            const el = findNodeEl(node)
            if (!el || typeof el.click !== 'function') continue
            used += 1
            el.click()
            await sleep(280)
            node.effect = { dialog: dialogOpen(), toast: toastOpen() }
            if (wantsSetValue) node.valueAfter = readProbeValue(node)
            if (node.effect.dialog) {
              closeDialog()
              await sleep(120)
            }
          }
        }

        async function snapshotTree(schema) {
          clearToasts()
          const root = document.getElementById('root')
          if (!root || !root.childElementCount) return { error: '未渲染' }
          const nodes = walkSchemaTree(schema)
          const formData = collectFormData()
          nodes.forEach(function (node) {
            const comp = readComponent(node)
            node.named = !!comp
            node.rendered = nodeRendered(node)
            node.value = readNodeValue(node, formData)
          })
          await probeTree(nodes)
          return {
            tree: nodes,
            smoke: true,
            text: (root.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 80),
            font: readFont(textTarget(root)),
            rootFont: readFont(document.body),
          }
        }

        function measure(spec) {
          clearToasts()
          const kind = (spec && spec.type) || 'pair'
          const rootFont = readFont(document.body)
          if (kind === 'smoke') {
            const root = document.getElementById('root')
            if (!root || !root.childElementCount) return { error: '未渲染' }
            return {
              smoke: true,
              text: (root.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 80),
              font: readFont(textTarget(root)),
              rootFont: rootFont,
            }
          }
          if (kind === 'style') {
            const el =
              (spec && spec.selector && document.querySelector(spec.selector)) ||
              (spec && spec.selectors && spec.selectors[0] && document.querySelector(spec.selectors[0])) ||
              document.querySelector('button')
            if (!el) return { error: '找不到可量节点' }
            const cs = getComputedStyle(el)
            const rect = el.getBoundingClientRect()
            const style = {}
            const props = (spec && spec.props) || ['width', 'height', 'paddingLeft', 'paddingRight', 'minWidth']
            for (let i = 0; i < props.length; i++) {
              const key = props[i]
              if (key === 'width') style[key] = round(rect.width) + 'px'
              else if (key === 'height') style[key] = round(rect.height) + 'px'
              else style[key] = cs[key]
            }
            return {
              style: style,
              font: readFont(el),
              rootFont: rootFont,
            }
          }
          const pair = pairNodes(spec)
          const a = pair[0]
          const b = pair[1]
          if (!a || !b) return { error: '找不到可量的两个节点' }
          const ra = a.getBoundingClientRect()
          const rb = b.getBoundingClientRect()
          const cs = getComputedStyle(b)
          const style = {}
          const props = (spec && spec.props) || ['marginLeft', 'display']
          for (let i = 0; i < props.length; i++) style[props[i]] = cs[props[i]]
          return {
            a: { top: round(ra.top), left: round(ra.left), width: round(ra.width), height: round(ra.height) },
            b: { top: round(rb.top), left: round(rb.left), width: round(rb.width), height: round(rb.height) },
            sameRow: Math.abs(ra.top - rb.top) <= 2,
            gap: round(rb.left - (ra.left + ra.width)),
            bMarginLeft: cs.marginLeft,
            style: style,
            font: readFont(a),
            rootFont: rootFont,
          }
        }

        function round(n) {
          return Math.round(n * 10) / 10
        }

        function waitForMeasure(spec, timeout) {
          return new Promise(function (resolve, reject) {
            const start = Date.now()
            function tick() {
              const result = measure(spec)
              if (!result.error) {
                resolve(result)
                return
              }
              if (Date.now() - start > timeout) {
                reject(new Error(result.error))
                return
              }
              setTimeout(tick, 50)
            }
            tick()
          })
        }

        function contentHeight() {
          const root = document.getElementById('root')
          if (!root) return 80
          const viewport = window.innerHeight
          let bottom = 0
          const nodes = [root].concat(Array.prototype.slice.call(document.body.querySelectorAll('*')))
          for (let i = 0; i < nodes.length; i++) {
            const el = nodes[i]
            const cs = getComputedStyle(el)
            if (cs.display === 'none' || cs.position === 'fixed') continue
            const rect = el.getBoundingClientRect()
            const fillsViewport = rect.top <= 1 && Math.abs(rect.height - viewport) <= 2
            if (fillsViewport) continue
            if (rect.bottom > bottom) bottom = rect.bottom
          }
          const next = Math.max(80, Math.ceil(bottom + 2))
          if (next > viewport && next <= viewport + 2) return viewport
          return next
        }

        let sizeTick = 0
        let lastPosted = 0
        function postSize() {
          if (parent === window) return
          const height = contentHeight()
          if (height === lastPosted) return
          lastPosted = height
          parent.postMessage({ type: 'vamis-compare-size', engine: engine, height: height }, '*')
        }

        function scheduleSize() {
          if (sizeTick) cancelAnimationFrame(sizeTick)
          sizeTick = requestAnimationFrame(function () {
            sizeTick = 0
            postSize()
          })
        }

        function report(payload) {
          const message = {
            type: 'vamis-compare',
            engine: engine,
            runId: payload.runId,
            measure: payload.measure || null,
            error: payload.error || null,
          }
          window.__vamisCompareLast = message
          parent.postMessage(message, '*')
          scheduleSize()
        }

        function unmountPrev() {
          if (scoped && typeof scoped.unmount === 'function') {
            try {
              scoped.unmount()
            } catch (_err) {
              /* ignore */
            }
          }
          scoped = null
          lastPosted = 0
          document.getElementById('root').innerHTML = ''
        }

        function loadScript(src) {
          return new Promise(function (resolve, reject) {
            const el = document.createElement('script')
            el.src = src
            el.onload = function () {
              resolve()
            }
            el.onerror = function () {
              reject(new Error('js ' + src))
            }
            document.head.appendChild(el)
          })
        }

        function findCatalogCase(want) {
          const rows = window.VAMIS_COMPARE_CASES || []
          const raw = String(want || '').trim()
          if (!raw) return null
          const lower = raw.toLowerCase()
          return (
            rows.find(function (row) {
              return row.id === raw
            }) ||
            rows.find(function (row) {
              return String(row.id).toLowerCase() === lower
            }) ||
            rows.find(function (row) {
              return String(row.id).toLowerCase().indexOf(lower) >= 0
            }) ||
            rows.find(function (row) {
              return String(row.page || '').toLowerCase() === lower
            }) ||
            null
          )
        }

        /** 顶层打开时认 ?case= / ?id=，拉对照目录后自己 embed。iframe 仍只吃 postMessage。 */
        async function runFromQuery() {
          if (parent !== window) return
          const q = new URLSearchParams(location.search)
          const want = q.get('case') || q.get('id')
          if (!want) return
          if (!window.VAMIS_COMPARE_CASES) await loadScript('./compare-cases.js?v=__VAMIS_SDK_V__')
          const row = findCatalogCase(want)
          if (!row) {
            failBoot('找不到用例 ' + want + '（?case= 对应用例 id，如 components-form-input-date-0）')
            return
          }
          document.title = (row.title || row.id) + ' · ' + engine
          run({
            runId: 1,
            schema: row.schema,
            measure: row.measure || { type: 'smoke' },
          })
        }

        function run(data) {
          runId = data.runId || 0
          const schema = data.schema
          const spec = data.measure || { type: 'pair', labels: data.labels || [] }
          if (!schema || typeof schema !== 'object') {
            report({ runId: runId, error: 'schema 无效' })
            return
          }
          unmountPrev()
          try {
            if (engine === 'amis') {
              const embed = window.amisRequire('amis/embed').embed
              scoped = embed('#root', schema, {}, forceMobile ? { mobileUI: true } : {})
            } else {
              // 对照吃文档 schema：adaptor / onError / custom 字符串函数体与 Playground 一样要 env.trusted。
              // SDK 默认仍关（D：new Function 仅受信任模式）；这里只开对照页。
              const env = { trusted: true, parseLocation: false }
              if (forceMobile) env.mobileUI = true
              scoped = window.vamis.embed('#root', schema, {}, env)
            }
          } catch (err) {
            report({ runId: runId, error: String(err && err.message ? err.message : err) })
            return
          }
          const started = runId
          scheduleSize()
          setTimeout(scheduleSize, 80)
          setTimeout(scheduleSize, 320)
          const pendingMeasure =
            spec.type === 'tree'
              ? waitForMeasure({ type: 'smoke' }, 8000).then(function () {
                  return waitForText(1500).then(function () {
                    return snapshotTree(schema)
                  })
                })
              : waitForMeasure(spec, spec.type === 'smoke' ? 4000 : 8000)
          pendingMeasure.then(
            function (result) {
              if (started !== runId) return
              if (result && result.error) {
                report({ runId: started, error: result.error })
                return
              }
              report({ runId: started, measure: result })
            },
            function (err) {
              if (started !== runId) return
              report({
                runId: started,
                error: String(err && err.message ? err.message : err),
              })
            },
          )
        }

        window.addEventListener('message', function (event) {
          const data = event.data
          if (!data || data.type !== 'vamis-compare-run') return
          if (!ready) {
            pending = data
            return
          }
          run(data)
        })

        async function boot() {
          const cssEls = assets.cssEls || []
          const waits = cssEls.map(function (el) {
            return waitAsset(el, 'css')
          })
          if (assets.jsEl) waits.push(waitAsset(assets.jsEl, 'js'))
          await Promise.all(waits)
          if (engine === 'amis' && typeof window.amisRequire !== 'function') {
            throw new Error('js ' + (assets.jsEl && assets.jsEl.src))
          }
          if (engine !== 'amis' && !window.__vamisSdkReady) {
            throw new Error('js ' + (assets.jsEl && assets.jsEl.src))
          }
          ready = true
          window.__vamisCompareReady = true
          parent.postMessage({ type: 'vamis-compare-ready', engine: engine }, '*')
          if (pending) {
            const next = pending
            pending = null
            run(next)
          }
          await runFromQuery()
        }

        if (typeof ResizeObserver === 'function') {
          new ResizeObserver(scheduleSize).observe(document.getElementById('root'))
        }
        if (typeof MutationObserver === 'function') {
          new MutationObserver(scheduleSize).observe(document.body, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['class', 'style', 'hidden'],
          })
        }
        window.addEventListener('load', scheduleSize)

        boot().catch(function (err) {
          failBoot(String(err && err.message ? err.message : err))
        })
      })()
    </script>
  </body>
</html>
