<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>compare frame</title>
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
      }
      #root {
        padding: 12px;
        min-height: 80px;
      }
      .err {
        color: #b91c1c;
        font: 13px/1.4 system-ui;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const params = new URLSearchParams(location.search)
        const engine = params.get('engine') || 'vamis'
        const amisSdk = params.get('amisSdk') || 'https://unpkg.com/amis@6.13.0/sdk'
        let ready = false
        let pending = null
        let scoped = null
        let runId = 0

        function failBoot(message) {
          document.getElementById('root').innerHTML = '<p class="err"></p>'
          document.querySelector('.err').textContent = message
          parent.postMessage(
            { type: 'vamis-compare', engine: engine, runId: runId, error: message },
            '*',
          )
        }

        function loadCss(href) {
          return new Promise(function (resolve, reject) {
            const el = document.createElement('link')
            el.rel = 'stylesheet'
            el.href = href
            el.onload = resolve
            el.onerror = function () {
              reject(new Error('css ' + href))
            }
            document.head.appendChild(el)
          })
        }

        function loadScript(src) {
          return new Promise(function (resolve, reject) {
            const el = document.createElement('script')
            el.src = src
            el.onload = resolve
            el.onerror = function () {
              reject(new Error('js ' + src))
            }
            document.body.appendChild(el)
          })
        }

        function measure(labels) {
          const wanted = labels || []
          const all = document.querySelectorAll('button, a')
          const nodes = []
          if (wanted.length >= 2) {
            for (let i = 0; i < all.length; i++) {
              const text = (all[i].textContent || '').trim()
              if (wanted.indexOf(text) >= 0) nodes.push(all[i])
            }
          } else {
            for (let i = 0; i < all.length && nodes.length < 2; i++) {
              const text = (all[i].textContent || '').trim()
              if (text) nodes.push(all[i])
            }
          }
          const a =
            wanted.length >= 2
              ? nodes.find(function (n) {
                  return n.textContent.trim() === wanted[0]
                })
              : nodes[0]
          const b =
            wanted.length >= 2
              ? nodes.find(function (n) {
                  return n.textContent.trim() === wanted[1]
                })
              : nodes[1]
          if (!a || !b) return { error: '找不到可量的两个按钮' }
          const ra = a.getBoundingClientRect()
          const rb = b.getBoundingClientRect()
          return {
            a: { top: round(ra.top), left: round(ra.left), width: round(ra.width), height: round(ra.height) },
            b: { top: round(rb.top), left: round(rb.left), width: round(rb.width), height: round(rb.height) },
            sameRow: Math.abs(ra.top - rb.top) <= 2,
            gap: round(rb.left - (ra.left + ra.width)),
            bMarginLeft: getComputedStyle(b).marginLeft,
          }
        }

        function round(n) {
          return Math.round(n * 10) / 10
        }

        function waitForMeasure(labels, timeout) {
          return new Promise(function (resolve, reject) {
            const start = Date.now()
            function tick() {
              const result = measure(labels)
              if (!result.error) {
                resolve(result)
                return
              }
              if (Date.now() - start > timeout) {
                reject(new Error(result.error))
                return
              }
              setTimeout(tick, 50)
            }
            tick()
          })
        }

        function report(payload) {
          parent.postMessage(
            {
              type: 'vamis-compare',
              engine: engine,
              runId: payload.runId,
              measure: payload.measure || null,
              error: payload.error || null,
            },
            '*',
          )
        }

        function unmountPrev() {
          if (scoped && typeof scoped.unmount === 'function') {
            try {
              scoped.unmount()
            } catch (_err) {
              /* ignore */
            }
          }
          scoped = null
          document.getElementById('root').innerHTML = ''
        }

        function run(data) {
          runId = data.runId || 0
          const schema = data.schema
          const labels = data.labels || []
          if (!schema || typeof schema !== 'object') {
            report({ runId: runId, error: 'schema 无效' })
            return
          }
          unmountPrev()
          try {
            if (engine === 'amis') {
              const embed = window.amisRequire('amis/embed').embed
              scoped = embed('#root', schema)
            } else {
              scoped = window.vamis.embed('#root', schema)
            }
          } catch (err) {
            report({ runId: runId, error: String(err && err.message ? err.message : err) })
            return
          }
          const started = runId
          waitForMeasure(labels, 8000).then(
            function (result) {
              if (started !== runId) return
              report({ runId: started, measure: result })
            },
            function (err) {
              if (started !== runId) return
              report({
                runId: started,
                error: String(err && err.message ? err.message : err),
              })
            },
          )
        }

        window.addEventListener('message', function (event) {
          const data = event.data
          if (!data || data.type !== 'vamis-compare-run') return
          if (!ready) {
            pending = data
            return
          }
          run(data)
        })

        async function boot() {
          if (engine === 'amis') {
            await loadCss(amisSdk.replace(/\/?$/, '/') + 'sdk.css')
            await loadCss(amisSdk.replace(/\/?$/, '/') + 'helper.css')
            await loadScript(amisSdk.replace(/\/?$/, '/') + 'sdk.js')
          } else {
            await loadCss('./sdk.css')
            await loadScript('./sdk.js')
          }
          ready = true
          parent.postMessage({ type: 'vamis-compare-ready', engine: engine }, '*')
          if (pending) {
            const next = pending
            pending = null
            run(next)
          }
        }

        boot().catch(function (err) {
          failBoot(String(err && err.message ? err.message : err))
        })
      })()
    </script>
  </body>
</html>
