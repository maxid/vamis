apiVersion: lcdp.ir/v1
kind: UiPage
metadata:
  name: crud-page
  description: 查询表格与弹窗编辑
  businessTerms:
    - device
  labels:
    source: amis
spec:
  type: page
  title: 设备清单
  body:
    - type: crud
      name: deviceCrud
      api: /api/mock2/sample
      perPage: 5
      filter:
        title: 条件搜索
        body:
          - type: input-text
            name: keywords
            label: 关键字
            placeholder: 引擎或浏览器包含
      columns:
        - name: id
          label: ID
        - name: engine
          label: 渲染引擎
        - name: browser
          label: Browser
        - name: grade
          label: 等级
        - type: operation
          label: 操作
          buttons:
            - type: button
              label: 编辑
              actionType: dialog
              dialog:
                title: 编辑
                body:
                  type: form
                  api: /api/mock2/sample
                  body:
                    - type: hidden
                      name: id
                    - type: input-text
                      name: engine
                      label: 渲染引擎
                      required: true
                    - type: input-text
                      name: browser
                      label: Browser
                    - type: select
                      name: grade
                      label: 等级
                      options:
                        - label: A
                          value: A
                        - label: C
                          value: C
                        - label: X
                          value: X
            - type: button
              label: 删除
              actionType: ajax
              confirmText: 确认删除这条记录？
              api: "delete:/api/mock2/sample/${id}"
