apiVersion: lcdp.ir/v1
kind: UiPage
metadata:
  name: validation-page
  description: 从表单验证官方样例抽出
  labels:
    source: amis
spec:
  type: page
  title: 表单验证
  subTitle: 来自 examples/components/Form/Validation.jsx
  body:
    - type: form
      title: 校验规则
      mode: horizontal
      api: /api/mock2/form/saveForm
      body:
        - type: input-text
          name: test
          label: 必填
          required: true
        - type: input-email
          name: test1
          label: Email
        - type: input-url
          name: url
          label: URL
        - type: input-text
          name: minLength
          label: 长度限制
          validations: "minLength:2,maxLength:10"
        - type: input-text
          name: min
          label: 数值限制
          validations: "maximum:10,minimum:2"
        - type: input-text
          name: reg
          label: 正则
          validations: "matchRegexp:/^abc/"
          validationErrors:
            matchRegexp: 请输入 abc 开头
        - type: input-text
          name: num
          label: 数字
          validations: isNumeric
        - type: unknown-chart
          title: 未知类型应占位
